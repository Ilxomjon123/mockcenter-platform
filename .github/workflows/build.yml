name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================
  # BUILD + SIGN + PUBLISH GITHUB RELEASE (auto-update feed)
  # ============================================
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            name: Windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS-ARM
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS-Intel

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Builds, signs the updater artifacts (latest.json + .sig),
      # and creates/updates the GitHub Release for the pushed tag.
      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MockCenter ${{ github.ref_name }}'
          releaseBody: 'Auto-update release. The app updates itself on next launch.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ============================================
  # NOTIFY TELEGRAM (installers from the release)
  # ============================================
  notify-telegram:
    name: Send to Telegram
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl && cd dl
          gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" \
            --pattern "*.exe" --pattern "*.dmg" --clobber || true
          ls -la

      - name: Send installers to Telegram
        continue-on-error: true
        run: |
          for FILE in dl/*.exe dl/*.dmg; do
            [ -f "$FILE" ] || continue
            curl -F document=@"$FILE" \
                 -F caption="📦 MockCenter ${{ github.ref_name }} — $(basename "$FILE")" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"
          done

      - name: Send completion message
        continue-on-error: true
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -d parse_mode="HTML" \
               -d text="🏁 <b>MockCenter ${{ github.ref_name }}</b> released ✅%0A🔄 Auto-update live%0A🔗 https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
