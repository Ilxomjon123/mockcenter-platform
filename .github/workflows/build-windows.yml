name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            name: Windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS-ARM
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS-Intel
          - platform: ubuntu-22.04
            args: ''
            name: Linux

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.args }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # Windows artifacts
      - name: Upload Windows EXE
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MockCenter-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload Windows MSI
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MockCenter-Windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      # macOS artifacts
      - name: Upload macOS DMG (ARM)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v4
        with:
          name: MockCenter-macOS-ARM-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Upload macOS DMG (Intel)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        uses: actions/upload-artifact@v4
        with:
          name: MockCenter-macOS-Intel-dmg
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

      # Linux artifacts
      - name: Upload Linux DEB
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: MockCenter-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: MockCenter-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload Linux RPM
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: MockCenter-Linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 30

  # Send all artifacts to Telegram
  notify-telegram:
    name: Send to Telegram
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f -name "*" | head -20

      - name: Send Windows EXE to Telegram
        if: hashFiles('artifacts/MockCenter-Windows-exe/*.exe') != ''
        run: |
          FILE=$(find artifacts/MockCenter-Windows-exe -name "*.exe" | head -1)
          curl -F document=@"$FILE" \
               -F caption="🪟 Windows Installer (.exe)
          📦 MockCenter Desktop
          🔖 ${{ github.ref_name }}
          📅 $(date +'%Y-%m-%d %H:%M')" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Send Windows MSI to Telegram
        if: hashFiles('artifacts/MockCenter-Windows-msi/*.msi') != ''
        run: |
          FILE=$(find artifacts/MockCenter-Windows-msi -name "*.msi" | head -1)
          curl -F document=@"$FILE" \
               -F caption="🪟 Windows Installer (.msi)
          📦 MockCenter Desktop
          🔖 ${{ github.ref_name }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Send macOS ARM DMG to Telegram
        if: hashFiles('artifacts/MockCenter-macOS-ARM-dmg/*.dmg') != ''
        run: |
          FILE=$(find artifacts/MockCenter-macOS-ARM-dmg -name "*.dmg" | head -1)
          curl -F document=@"$FILE" \
               -F caption="🍎 macOS Apple Silicon (.dmg)
          📦 MockCenter Desktop
          🔖 ${{ github.ref_name }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Send macOS Intel DMG to Telegram
        if: hashFiles('artifacts/MockCenter-macOS-Intel-dmg/*.dmg') != ''
        run: |
          FILE=$(find artifacts/MockCenter-macOS-Intel-dmg -name "*.dmg" | head -1)
          curl -F document=@"$FILE" \
               -F caption="🍎 macOS Intel (.dmg)
          📦 MockCenter Desktop
          🔖 ${{ github.ref_name }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Send Linux DEB to Telegram
        if: hashFiles('artifacts/MockCenter-Linux-deb/*.deb') != ''
        run: |
          FILE=$(find artifacts/MockCenter-Linux-deb -name "*.deb" | head -1)
          curl -F document=@"$FILE" \
               -F caption="🐧 Linux Debian/Ubuntu (.deb)
          📦 MockCenter Desktop
          🔖 ${{ github.ref_name }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Send Linux AppImage to Telegram
        if: hashFiles('artifacts/MockCenter-Linux-AppImage/*.AppImage') != ''
        run: |
          FILE=$(find artifacts/MockCenter-Linux-AppImage -name "*.AppImage" | head -1)
          curl -F document=@"$FILE" \
               -F caption="🐧 Linux Universal (.AppImage)
          📦 MockCenter Desktop
          🔖 ${{ github.ref_name }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Send completion message
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
               -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -d parse_mode="HTML" \
               -d text="✅ <b>Build Complete!</b>

          📦 <b>MockCenter Desktop</b>
          🔖 Version: <code>${{ github.ref_name }}</code>
          📝 Commit: <code>${{ github.sha }}</code>

          🔗 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Build Logs</a>"
